
name: Gerar APK Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do jogo
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Cordova
        run: npm install -g cordova@12

      - name: Preparar arquivos do Distrito X City
        run: |
          mkdir -p "$RUNNER_TEMP/gtax-www"

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='app/' \
            --exclude='platforms/' \
            --exclude='plugins/' \
            ./ "$RUNNER_TEMP/gtax-www/"

      - name: Configurar HTML principal e URL padrão do servidor
        run: |
          cd "$RUNNER_TEMP/gtax-www"

          python3 - <<'PY'
          from pathlib import Path
          import shutil
          import sys

          preferidos = [
              "GTA-X-RGB-Chat-Aeroporto-BANCOS-CORRIGIDOS.html",
              "index.html",
              "Index.html",
              "GTA-X-RGB-Chat-Aeroporto.html",
              "GTA-X-Neon-RGB-Leve-1.html",
              "GTA-X-Neon-RGB-Leve.html",
              "GTA.X2D.html"
          ]

          origem = None
          for nome in preferidos:
              arquivo = Path(nome)
              if arquivo.is_file():
                  origem = arquivo
                  break

          if origem is None:
              arquivos = sorted(p for p in Path(".").glob("*.html") if p.is_file())
              if arquivos:
                  origem = arquivos[0]

          if origem is None:
              print("ERRO: Nenhum HTML encontrado!")
              sys.exit(1)

          destino = Path("index.html")
          if origem.resolve() != destino.resolve():
              shutil.copy2(origem, destino)

          html = destino.read_text(encoding="utf-8", errors="ignore")
          default_url = "https://reinos-de-aco-server.onrender.com"
          html = html.replace("https://seu-servidor.onrender.com", default_url)
          if "DEFAULT_SERVER_1" not in html:
              html = html.replace(
                  "(localStorage.getItem('gtax_server_1') || localStorage.getItem('gtax_mp_url') || '').trim()",
                  f"(localStorage.getItem('gtax_server_1') || localStorage.getItem('gtax_mp_url') || '{default_url}').trim()"
              )
          destino.write_text(html, encoding="utf-8")

          print(f"HTML principal configurado: {origem} -> index.html")
          PY

      - name: Criar projeto Android
        run: |
          cordova create app com.elias.gtax "Distrito X City"

          rm -rf app/www/*
          cp -a "$RUNNER_TEMP/gtax-www/." app/www/

          test -s app/www/index.html

          echo "Arquivos copiados para o Cordova:"
          find app/www -maxdepth 2 -type f | sort

      - name: Configurar permissões de rede e ícone Distrito X City
        run: |
          mkdir -p app/res

          python3 - <<'PY'
          from pathlib import Path
          import shutil

          config = Path("app/config.xml")
          content = config.read_text(encoding="utf-8")

          extras = [
              '    <access origin="*" />',
              '    <allow-navigation href="*" />',
              '    <allow-intent href="http://*/*" />',
              '    <allow-intent href="https://*/*" />'
          ]
          for line in extras:
              tag = line.strip().split()[0]
              if tag not in content:
                  content = content.replace("</widget>", f"{line}\n</widget>")

          candidates = [Path("icon.png"), Path("icone.png")]
          icon = next((p for p in candidates if p.is_file()), None)
          if icon:
              shutil.copy2(icon, "app/res/icon.png")
              if 'src="res/icon.png"' not in content:
                  content = content.replace("</widget>", '    <icon src="res/icon.png" />\n</widget>')
              print("Ícone Distrito X City configurado!")
          else:
              print("Aviso: ícone não encontrado.")

          config.write_text(content, encoding="utf-8")
          print("Permissões de rede configuradas no config.xml")
          PY

      - name: Instalar plataforma Android
        run: |
          cd app
          cordova platform add android@13.0.0

      - name: Compilar APK
        run: |
          cd app
          cordova build android --debug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: DISTRITO-X-CITY-APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
