name: Gerar APK Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do jogo
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Motor (Cordova)
        run: npm install -g cordova

      - name: Construir o APK
        run: |
          mkdir -p ../temp_build
          cp -r . ../temp_build/

          cordova create app com.elias.gtax "GTA X"
          rm -rf app/www/*
          cp -r ../temp_build/* app/www/
          rm -rf app/www/app app/www/.git

          sed -i 's|</widget>|    <icon src="www/icone.png" />\n</widget>|' app/config.xml

          cd app
          cordova platform add android
          cordova build android

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: GTAX APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
