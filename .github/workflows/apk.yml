
name: Gerar APK Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do jogo
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Cordova
        run: npm install -g cordova@12

      - name: Preparar arquivos do GTA X
        run: |
          mkdir -p "$RUNNER_TEMP/gtax-www"

          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='app/' \
            --exclude='platforms/' \
            --exclude='plugins/' \
            ./ "$RUNNER_TEMP/gtax-www/"

      - name: Criar projeto Android
        run: |
          cordova create app com.elias.gtax "GTA X"

          rm -rf app/www/*
          cp -a "$RUNNER_TEMP/gtax-www/." app/www/

      - name: Configurar ícone GTA X
        run: |
          mkdir -p app/res

          if [ -f "icon.png" ]; then
            cp icon.png app/res/icon.png
          elif [ -f "icone.png" ]; then
            cp icone.png app/res/icon.png
          else
            echo "Ícone não encontrado. Continuando sem ícone personalizado."
          fi

          if [ -f "app/res/icon.png" ]; then
            python3 -c '
          from pathlib import Path
          p = Path("app/config.xml")
          s = p.read_text()
          s = s.replace("</widget>", "    <icon src=\"res/icon.png\" />\n</widget>")
          p.write_text(s)
          '

      - name: Instalar plataforma Android
        run: |
          cd app
          cordova platform add android@13.0.0

      - name: Compilar APK
        run: |
          cd app
          cordova build android --debug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: GTA-X-APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
