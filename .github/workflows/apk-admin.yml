name: Gerar APK Distrito X ADM

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Cordova
        run: npm install -g cordova@12

      - name: Criar projeto Android do painel ADM
        run: |
          test -s painel.html
          cordova create adm com.distritox.adm "Distrito X ADM"
          rm -rf adm/www/*
          cp painel.html adm/www/index.html
          cd adm
          cordova platform add android@13.0.0

      - name: Configurar acesso de rede
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('adm/config.xml')
          s=p.read_text(encoding='utf-8')
          additions=['    <access origin="*" />','    <allow-navigation href="*" />','    <allow-intent href="http://*/*" />','    <allow-intent href="https://*/*" />']
          for line in additions:
              if line.strip().split()[0] not in s:
                  s=s.replace('</widget>',line+'\n</widget>')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Compilar APK ADM
        run: |
          cd adm
          cordova build android --debug

      - name: Disponibilizar APK do painel
        uses: actions/upload-artifact@v4
        with:
          name: DISTRITO-X-ADM-APK
          path: adm/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
