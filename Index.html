* {
  box-sizing: border-box;

html, body {
  color: #fff;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  background: #161b20;
  width: 100%;
  height: 100%;
  margin: 0;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

canvas {
  width: 100vw;
  height: 100vh;
  display: block;
}

:root {
  --ms: clamp(88px, 27vh, 140px);
}

body[data-state="title"] #ui, body[data-state="title"] #joy, body[data-state="title"] #buttons, body[data-state="title"] #map, body[data-state="title"] #pause, body[data-state="title"] #zoomControls, body[data-state="title"] #mpBar, body[data-state="title"] #chatOpenBtn, body[data-state="title"] #voicePTT, body[data-state="title"] #chatLog, body[data-state="title"] #chatBox {
  display: none !important;
}

#ui {
  z-index: 4;
  pointer-events: none;
  text-shadow: 1px 2px 3px #000;
  position: fixed;
  inset: 0;
}

#stats {
  left: calc(2% + var(--ms) + 16px);
  background: #0c121cb8;
  border: 2px solid #111018;
  border-radius: 10px;
  padding: 6px 11px;
  font-size: clamp(12px, 1.7vw, 18px);
  font-weight: 700;
  line-height: 1.45;
  position: absolute;
  top: 3%;
  box-shadow: 0 3px #00000073;
}

#cash {
  color: #5cf28a;
}

#mission {
  white-space: nowrap;
  text-overflow: ellipsis;
  background: #10151ae6;
  border: 2px solid #111018;
  border-radius: 10px;
  max-width: 42vw;
  padding: 7px 14px;
  font-size: clamp(11px, 1.6vw, 17px);
  font-weight: 700;
  position: absolute;
  top: 3%;
  left: 50%;
  overflow: hidden;
  transform: translate(-50%);
  box-shadow: 0 3px #00000073;
}

#safeZoneBadge {
  color: #e8fff0;
  letter-spacing: 1px;
  background: #188a42f0;
  border: 2px solid #111018;
  border-radius: 99px;
  padding: 4px 14px;
  font-size: 11px;
  font-weight: 800;
  display: none;
  position: absolute;
  top: 10.5%;
  left: 50%;
  transform: translate(-50%);
  box-shadow: inset 0 0 0 1.5px #80e27e, 0 2px #00000073;
}

#clock {
  background: #0c121ca6;
  border: 2px solid #111018;
  border-radius: 8px;
  padding: 3px 9px;
  font-size: clamp(12px, 1.8vw, 17px);
  font-weight: 800;
  position: absolute;
  top: 3%;
  right: calc(2% + 46px);
}

#stars {
  display: none !important;
}

#health {
  background: #1a1f28;
  border: 2.5px solid #111018;
  border-radius: 9px;
  width: min(32vw, 280px);
  height: 14px;
  position: absolute;
  bottom: 3%;
  left: 50%;
  overflow: hidden;
  transform: translate(-50%);
  box-shadow: 0 0 0 1.5px #ffffffbf, 0 3px #00000080;
}

#hp {
  background: linear-gradient(#74f07a, #41b849);
  width: 100%;
  height: 100%;
  transition: width .12s;
}

#msg {
  color: #ffe082;
  text-align: center;
  max-width: 75vw;
  font-size: clamp(12px, 1.8vw, 18px);
  font-weight: 700;
  position: absolute;
  top: 17%;
  left: 50%;
  transform: translate(-50%);
}

#tip {
  text-align: center;
  color: #ffffffeb;
  text-shadow: 0 1px 3px #000000e0;
  max-width: 58vw;
  font-size: 11px;
  font-weight: 700;
  animation: 1s 12s forwards tf;
  position: absolute;
  top: 15.2%;
  left: 50%;
  transform: translateX(-50%);
}

@keyframes tf {
  to {
    opacity: 0;
  }
}

#joy {
  aspect-ratio: 1;
  pointer-events: auto;
  z-index: 6;
  background: #1117;
  border: 2.5px solid #111018;
  border-radius: 50%;
  width: clamp(112px, 18vw, 158px);
  position: fixed;
  bottom: 12%;
  left: 4%;
  box-shadow: inset 0 0 0 1.5px #fff8, 0 3px 10px #00000073;
}

#knob {
  background: #fff9;
  border: 2px solid #111018;
  border-radius: 50%;
  width: 38%;
  height: 38%;
  position: absolute;
  top: 31%;
  left: 31%;
  box-shadow: inset 0 0 0 1.5px #fff;
}

#buttons {
  z-index: 6;
  pointer-events: auto;
  grid-template-columns: repeat(3, clamp(52px, 7.5vw, 68px));
  grid-auto-rows: clamp(52px, 7.5vw, 68px);
  align-items: center;
  gap: 6px;
  display: grid;
  position: fixed;
  bottom: 4%;
  right: 2%;
}

#buttons:not(.car-mode) #carFoot {
  grid-area: 1 / 1;
}

#buttons:not(.car-mode) #passenger {
  grid-area: 1 / 2;
}

#buttons:not(.car-mode) #fire {
  grid-area: 1 / 3;
  transform: scale(1.12);
}

#buttons:not(.car-mode) #elevator {
  grid-area: 2 / 1;
}

#buttons:not(.car-mode) #run {
  grid-area: 2 / 2;
}

#buttons:not(.car-mode) #aim {
  grid-area: 2 / 3;
}

#buttons:not(.car-mode) #weapon {
  grid-area: 3 / 1;
}

#buttons:not(.car-mode) #crouch {
  grid-area: 3 / 2;
}

#buttons:not(.car-mode) #jump {
  grid-area: 3 / 3;
}

#joy, #buttons, #mpBar, #voicePTT, #chatOpenBtn, #pause, #zoomControls {
  zoom: var(--dx-hud-scale, 1);
}

#buttons.car-mode {
  grid-template-columns: repeat(2, clamp(58px, 9vw, 82px));
  gap: 9px;
}

#buttons.car-mode [data-vehicle]:last-child {
  grid-column: 1 / -1;
  justify-self: end;
}

.b {
  aspect-ratio: 1;
  color: #fff;
  touch-action: none;
  cursor: pointer;
  background: #141922dd;
  border: 2px solid #111018;
  border-radius: 50%;
  font-size: clamp(9px, 1.2vw, 13px);
  font-weight: 800;
  box-shadow: inset 0 0 0 1.5px #fffa, 0 3px #00000080;
}

.b.active {
  background: #d59b20;
}

#aim {
  color: #b9efff;
  background: linear-gradient(145deg, #125680ee, #082034ee);
  border: 2px solid #111018;
  box-shadow: inset 0 0 0 2px #63d8ff, 0 0 12px #28bfff66;
}

#aim.locked {
  color: #fff;
  background: linear-gradient(145deg, #a62020, #461010);
  box-shadow: inset 0 0 0 2px #ff6b6b, 0 0 14px #f339;
}

#fire {
  background: linear-gradient(145deg, #9a241b, #3d0d0a);
  border: 2px solid #111018;
  box-shadow: inset 0 0 0 2px #ff8b65, 0 0 10px #ff603855;
}

#run {
  box-sizing: border-box;
  aspect-ratio: 1;
  white-space: nowrap;
  justify-content: center;
  align-items: center;
  width: clamp(58px, 8.5vw, 76px);
  min-width: 0;
  height: clamp(58px, 8.5vw, 76px);
  min-height: 0;
  padding: 0;
  font-size: clamp(8px, 1.05vw, 12px);
  line-height: 1;
  transition: background-color .12s, border-color .12s;
  display: flex;
  overflow: hidden;
  transform: none !important;
}

#run.active {
  background: #d59b20;
  box-shadow: inset 0 0 0 2px #ffe08a;
}

#buttons:not(.car-mode) #run {
  z-index: 2;
  flex: none;
  position: relative;
  inset: auto;
  visibility: visible !important;
  display: flex !important;
  transform: none !important;
}

.weapon-button {
  color: #ffe6a3;
  background: linear-gradient(145deg, #26394c, #111b24);
  border: 2px solid #111018;
  font-size: clamp(8px, 1.05vw, 12px);
  box-shadow: inset 0 0 0 2px #ffd166, 0 0 9px #ffd16655;
}

#map {
  width: var(--ms);
  height: var(--ms);
  z-index: 5;
  left: max(2%, env(safe-area-inset-left));
  top: max(2%, env(safe-area-inset-top));
  pointer-events: none;
  background: #262b33;
  border: 3px solid #111018;
  border-radius: 50%;
  position: fixed;
  box-shadow: 0 0 0 2px #ffffffb0, 0 4px 10px #000b;
}

#pause {
  z-index: 6;
  color: #fff;
  pointer-events: auto;
  cursor: pointer;
  background: #141b24dd;
  border: 2px solid #111018;
  border-radius: 50%;
  width: 36px;
  height: 36px;
  font-weight: 800;
  position: fixed;
  top: 2%;
  right: 2%;
  box-shadow: inset 0 0 0 1.5px #fff;
}

#zoomControls {
  z-index: 6;
  pointer-events: auto;
  gap: 5px;
  display: grid;
  position: fixed;
  top: calc(2% + 44px);
  right: 2%;
}

.zoom-btn {
  color: #fff;
  touch-action: none;
  cursor: pointer;
  background: #141b24dd;
  border: 2px solid #111018;
  border-radius: 9px;
  width: 36px;
  height: 36px;
  font-size: 22px;
  font-weight: 700;
  line-height: 1;
  box-shadow: inset 0 0 0 1.5px #ffffffa0;
}

.zoom-btn:active {
  background: #d59b20;
}

#modal, #deathModal {
  z-index: 50;
  text-align: center;
  pointer-events: auto;
  background: #000c;
  justify-content: center;
  align-items: center;
  display: none;
  position: fixed;
  inset: 0;
}

#modal > div, #deathModal > div {
  background: #17212b;
  border: 2px solid #8995a0;
  border-radius: 14px;
  width: min(90%, 410px);
  max-height: 92vh;
  padding: 22px;
  overflow: auto;
  box-shadow: 0 20px 60px #000;
}

#deathModal > div {
  background: linear-gradient(160deg, #2a1216, #141b22);
  border-color: #ff5252;
}

#deathModal h2 {
  color: #ff6b6b;
  letter-spacing: 2px;
  margin: 0 0 8px;
  font-size: 24px;
}

#modal button, #deathModal button {
  color: #111;
  letter-spacing: 1px;
  cursor: pointer;
  background: #e0a323;
  border: 2px solid #111018;
  border-radius: 9px;
  margin: 5px;
  padding: 12px 18px;
  font-size: 13px;
  font-weight: 900;
}

#deathModal button {
  color: #081c0c;
  background: linear-gradient(#69f0ae, #2e7d32);
  width: 100%;
  margin: 10px 0 0;
  box-shadow: 0 4px #164419;
}

#rot {
  z-index: 120;
  color: #fff;
  text-align: center;
  background: #10151a;
  justify-content: center;
  align-items: center;
  padding: 24px;
  font: 700 18px Arial;
  display: none;
  position: fixed;
  inset: 0;
}

@media (orientation: portrait) {
  #rot {
    display: flex;
  }
}

#errbox {
  z-index: 130;
  color: #ffd6d6;
  background: #2b1114ee;
  border: 1px solid #ff6b6b;
  border-radius: 10px;
  max-height: 36vh;
  padding: 10px 14px;
  font: 12px / 1.4 monospace;
  display: none;
  position: fixed;
  bottom: 12px;
  left: 12px;
  right: 12px;
  overflow: auto;
