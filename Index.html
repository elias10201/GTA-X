<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#10151a">
<title>GTA X — Canvas Online</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10151a;color:#fff;font-family:Arial,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
canvas{display:block}
#game{width:100vw;height:100vh}
#ui{position:fixed;inset:0;pointer-events:none;text-shadow:1px 2px 3px #000}
#stats{position:absolute;left:calc(2% + var(--map-size) + 15px);top:3%;font-size:clamp(12px,1.6vw,17px);font-weight:bold;line-height:1.45}
#mission{position:absolute;left:50%;top:3%;transform:translateX(-50%);max-width:43vw;padding:7px 12px;border-radius:8px;background:#10151acc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:clamp(11px,1.5vw,16px)}
#clock{position:absolute;right:calc(2% + 44px);top:3%;font-weight:bold}
#message{position:absolute;left:50%;top:16%;transform:translateX(-50%);color:#ffe082;font-weight:bold;text-align:center;max-width:70vw}
#health{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);width:min(32vw,280px);height:13px;background:#25282d;border:1px solid #fff;border-radius:8px;overflow:hidden}
#hp{height:100%;width:100%;background:#55cf65}
#hint{position:absolute;left:2%;top:calc(3% + var(--map-size) + 8px);font-size:11px;color:#fffc;max-width:40vw}
:root{--map-size:clamp(88px,26vh,140px)}
#map{position:fixed;left:2%;top:2%;width:var(--map-size);height:var(--map-size);border:3px solid #111;border-radius:50%;box-shadow:0 0 0 1px #fffa,0 3px 12px #000b;background:#303842;pointer-events:none}
#joystick{position:fixed;left:5%;bottom:10%;width:clamp(105px,19vw,165px);aspect-ratio:1;border:2px solid #ffffff88;border-radius:50%;background:#10151a88;touch-action:none}
#knob{position:absolute;width:38%;height:38%;left:31%;top:31%;border:2px solid white;border-radius:50%;background:#ffffff99}
#buttons{position:fixed;right:2%;bottom:4%;display:grid;grid-template-columns:repeat(3,clamp(50px,7.5vw,76px));gap:7px}
#buttons.vehicle{grid-template-columns:repeat(2,clamp(58px,9vw,82px))}
.control{aspect-ratio:1;border:1px solid #ffffffaa;border-radius:50%;background:#10151ac9;color:#fff;font-size:clamp(9px,1.2vw,13px);font-weight:bold;touch-action:none}
.control.active{background:#bb8724}
#pause{position:fixed;right:2%;top:2%;width:35px;height:35px;border:1px solid white;border-radius:50%;background:#10151ac9;color:white;font-weight:bold}
#bar{position:fixed;left:calc(2% + var(--map-size) + 15px);bottom:calc(3% + 23px);display:flex;flex-wrap:wrap;gap:6px;z-index:7}
.pill{border:1px solid #ffffff88;border-radius:7px;background:#10151ad9;color:white;padding:5px 8px;font-size:11px;font-weight:bold}
.pill.online{background:#196736;border-color:#80e27e}
.pill.offline{background:#80530d;border-color:#ffd54f}
#chatLog{position:fixed;left:calc(2% + var(--map-size) + 15px);bottom:calc(3% + 53px);width:min(330px,46vw);max-height:110px;overflow:hidden;display:flex;flex-direction:column;gap:3px;pointer-events:none}
.chatLine{padding:4px 7px;background:#10151ad9;border-left:3px solid #00e5ff;border-radius:5px;font-size:11px;word-break:break-word;text-shadow:1px 1px 2px #000}
.chatLine b{color:#ffe082}
#chatBox{display:none;position:fixed;left:50%;bottom:14%;transform:translateX(-50%);z-index:15;width:min(92vw,390px);padding:8px;gap:6px;background:#17212bf5;border:1px solid #8995a0;border-radius:10px}
#chatBox input,#onlineModal input{min-width:0;padding:9px;background:#0f161d;color:#fff;border:1px solid #596c76;border-radius:7px;touch-action:auto;user-select:text;-webkit-user-select:text}
#chatBox input{flex:1}
#chatBox button,.dialog button{padding:9px 12px;border:0;border-radius:7px;background:#e0a323;color:#111;font-weight:bold}
.overlay{display:none;position:fixed;inset:0;z-index:20;align-items:center;justify-content:center;background:#000b;text-align:center}
.dialog{width:min(92%,440px);padding:23px;background:#17212b;border:1px solid #8995a0;border-radius:14px}
.dialog h2,.dialog h3{margin-top:0}
.dialog button{margin:4px}
.dialog .secondary{background:#42525d;color:#fff}
.dialog label{display:block;margin-top:12px;text-align:left;font-size:12px}
.dialog input{width:100%;margin-top:5px}
#status{font-size:12px;color:#ffe082}
#rotate{display:none;position:fixed;inset:0;z-index:30;align-items:center;justify-content:center;background:#10151a;text-align:center;padding:20px;font-weight:bold}
@media(orientation:portrait){#rotate{display:flex}}
#error{display:none;position:fixed;left:12px;right:12px;bottom:12px;z-index:99;padding:10px;background:#381719ee;border:1px solid #f77;border-radius:8px;font:12px monospace}
</style>
</head>
<body>
<canvas id="game"></canvas>
<canvas id="map" width="180" height="180"></canvas>

<div id="ui">
  <div id="stats">GTA X<br><span id="money">$500</span> · <span id="playerName">Rafa</span><br><span id="weaponName">Pistola 12/12</span></div>
  <div id="mission">MISSÃO: Primeiro Assalto</div>
  <div id="clock">16:28</div>
  <div id="message"></div>
  <div id="health"><div id="hp"></div></div>
  <div id="hint">Controle esquerdo: andar · Arraste a tela: câmera</div>
</div>

<div id="joystick"><div id="knob"></div></div>

<div id="buttons">
  <button class="control" data-action="fire" data-foot>ATIRAR</button>
  <button class="control" data-action="run" data-foot>CORRER</button>
  <button class="control" data-action="crouch" data-foot>AGACHAR</button>
  <button class="control" data-action="jump" data-foot>PULAR</button>
  <button class="control" data-action="car" data-foot>ENTRAR</button>
  <button class="control" data-action="weapon" data-foot>ARMA</button>
  <button class="control" data-action="swap" data-foot>TROCAR</button>
  <button class="control" data-action="accelerate" data-vehicle hidden>ACELERAR</button>
  <button class="control" data-action="brake" data-vehicle hidden>FREIO</button>
  <button class="control" data-action="car" data-vehicle hidden>SAIR</button>
</div>

<button id="pause" type="button">Ⅱ</button>

<div id="bar">
  <button id="onlineButton" class="pill offline" type="button">🌐 ONLINE: CONECTANDO...</button>
  <button id="chatButton" class="pill" type="button">💬 CHAT</button>
  <span id="count" class="pill">1 PLAYER</span>
</div>

<div id="chatLog"></div>

<div id="chatBox">
  <input id="chatInput" maxlength="110" placeholder="Digite sua mensagem...">
  <button id="sendChat" type="button">ENVIAR</button>
  <button id="closeChat" type="button">X</button>
</div>

<div id="pauseModal" class="overlay">
  <div class="dialog">
    <h2>GTA X — PAUSADO</h2>
    <button id="resume" type="button">CONTINUAR</button>
    <button id="restart" type="button">REINICIAR</button>
  </div>
</div>

<div id="onlineModal" class="overlay">
  <div class="dialog">
    <h3>GTA X — Multiplayer</h3>
    <label>Seu nick<input id="nickInput" maxlength="16" placeholder="Seu nome"></label>
    <label>URL do servidor — deixe vazia para usar o site atual<input id="serverInput" placeholder="https://seu-servidor.com"></label>
    <button id="connectButton" type="button">SALVAR / CONECTAR</button>
    <button id="closeOnline" class="secondary" type="button">FECHAR</button>
    <p id="status">Conectando...</p>
  </div>
</div>

<div id="rotate">↻ Gire o celular para o modo deitado</div>
<div id="error"></div>

<script>
(()=>{'use strict';

const $=id=>document.getElementById(id);
const canvas=$('game'),g=canvas.getContext('2d');
const map=$('map'),mg=map.getContext('2d');
const PI=Math.PI,TAU=PI*2,P=64;
const sin=Math.sin,cos=Math.cos;
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const rand=(a,b)=>a+Math.random()*(b-a);

addEventListener('error',e=>{
  $('error').style.display='block';
  $('error').textContent='Erro: '+(e.error?.message||e.message);
});

let W=1,H=1,dpr=1,quality=1,frames=0,frameTime=0;
function resize(){
  W=Math.max(1,innerWidth);H=Math.max(1,innerHeight);
  dpr=Math.min(devicePixelRatio||1,1.5)*quality;
  canvas.width=Math.round(W*dpr);
  canvas.height=Math.round(H*dpr);
  g.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener('resize',resize);
resize();

function hash(x,z){
  let a=(Math.imul(x,73856093)^Math.imul(z,19349663))|0;
  a^=a>>>13;a=Math.imul(a,0x5bd1e995);a^=a>>>15;
  return a&0x7fffffff;
}
const pal=[0xb5a99b,0x93a9b8,0xc9b79d,0x9baa9d,0xbb938e,0x838f9e];
const carColors=[0xc62828,0x1565c0,0xf9a825,0xe9ecef,0x2e7d32,0x6a1b9a];
const shirts=[0xd32f2f,0x8e24aa,0x1e88e5];
const skins=[0xe0ac69,0x8d5524,0xf1c27d];
const characterNames=['Rafa','Duda','Kaio'];
const carNames=['Velox Sedan','Torro GT','Atlas SUV','Rhino Picape'];
const carSpecs=[
  {width:.95,length:2.2,height:1.2,speed:30},
  {width:1.05,length:2.25,height:1.05,speed:42},
  {width:1.1,length:2.4,height:1.5,speed:28},
  {width:1.05,length:2.5,height:1.3,speed:26}
];
const weapons=['Pistola','SMG','Escopeta','Fuzil','Sniper'];
const capacities=[12,30,6,30,5];
const ammo=[...capacities];
const fireRates=[.35,.09,.8,.13,1.2];

let player={x:32,z:32,yaw:0},characters=[
  {x:32,z:32,yaw:0},
  {x:96,z:32,yaw:0},
  {x:-32,z:96,yaw:0}
];
let character=0,weapon=0,money=500,health=[200,200,200];
let car=null,camYaw=0,camPitch=.08;
let joy={x:0,y:0},held={},crouch=false,jumpHeight=0,jumpVelocity=0;
let paused=false,gameTime=.68,anim=0,shootCooldown=0,flash=0;
let moveAnim=0,moveAmount=0,message='',messageTime=0;
let weather=0,weatherTimer=60,missionIndex=0,missionStage=0;
let target={x:160,z:32},bubble={text:'',time:0};
let bullets=[];
const missions=[
  {name:'Primeiro Assalto',steps:[{type:'point',x:2,z:0},{type:'car'},{type:'point',x:-3,z:2}],reward:500},
  {name:'Fuga Noturna',steps:[{type:'car'},{type:'point',x:3,z:0}],reward:1000},
  {name:'O Grande Golpe',steps:[{type:'point',x:4,z:4},{type:'car'},{type:'drive',x:-4,z:3}],reward:2500},
  {name:'Entrega Perigosa',steps:[{type:'car'},{type:'drive',x:5,z:-2}],reward:3500}
];
const cars=[
  {id:'carro_1',x:24,z:50,yaw:0,speed:0,color:carColors[0],type:0,driverId:null},
  {id:'carro_2',x:40,z:10,yaw:PI,speed:0,color:carColors[1],type:1,driverId:null},
  {id:'carro_3',x:74,z:38,yaw:PI/2,speed:0,color:carColors[2],type:2,driverId:null},
  {id:'carro_4',x:-8,z:38,yaw:-PI/2,speed:0,color:carColors[3],type:3,driverId:null}
];

function zone(ix,iz){
  if(Math.abs(ix-14)<=3&&Math.abs(iz-13)<=2)return 1;
  if(ix*ix+iz*iz<144)return 0;
  return hash(Math.floor(ix/4),Math.floor(iz/4))%10<3?1:0;
}
function treePosition(ix,iz,n){
  const a=hash(ix*7+n,iz*5+n);
  return {x:ix*P+a%48-24,z:iz*P+(a>>8)%48-24,seed:a};
}
function solid(x,z){
  const ix=Math.round(x/P),iz=Math.round(z/P);
  for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++){
    const bx=ix+i,bz=iz+j,zn=zone(bx,bz);
    if(!zn&&hash(bx,bz)%6!==0&&Math.abs(x-bx*P)<16&&Math.abs(z-bz*P)<16)return true;
    if(zn)for(let n=0;n<3;n++){
      const t=treePosition(bx,bz,n);
      if(Math.hypot(x-t.x,z-t.z)<1.25)return true;
    }
  }
  return false;
}
function carCollision(x,z,radius,ignore){
  let outX=x,outZ=z,hit=null;
  for(const c of cars){
    if(c===ignore)continue;
    const spec=carSpecs[c.type]||carSpecs[0];
    const s=sin(c.yaw),co=cos(c.yaw);
    const dx=outX-c.x,dz=outZ-c.z;
    let lx=dx*co-dz*s,lz=dx*s+dz*co;
    const wx=spec.width+radius,wz=spec.length+radius;
    if(Math.abs(lx)<wx&&Math.abs(lz)<wz){
      if(wx-Math.abs(lx)<wz-Math.abs(lz))lx=(lx>=0?1:-1)*wx;
      else lz=(lz>=0?1:-1)*wz;
      outX=c.x+lx*co+lz*s;
      outZ=c.z-lx*s+lz*co;
      hit=c;
    }
  }
  return {x:outX,z:outZ,hit};
}
function say(text){message=text;messageTime=3.5}
function missionStep(){return missions[missionIndex].steps[missionStage]}
function updateTarget(){
  const step=missionStep();
  if(step&&step.x!==undefined)target={x:step.x*P+32,z:step.z*P+32};
}
function checkMission(){
  const step=missionStep();
  if(!step)return;
  let done=false;
  if(step.type==='car')done=!!car;
  if(step.type==='point')done=Math.hypot(player.x-target.x,player.z-target.z)<9;
  if(step.type==='drive')done=!!car&&Math.hypot(player.x-target.x,player.z-target.z)<10;
  if(!done)return;
  missionStage++;
  if(missionStage>=missions[missionIndex].steps.length){
    money+=missions[missionIndex].reward;
    say('Missão cumprida! +$'+missions[missionIndex].reward);
    health[character]=200;
    missionIndex=(missionIndex+1)%missions.length;
    missionStage=0;
  }
  updateTarget();
}
updateTarget();

function syncButtons(){
  const driving=!!car;
  $('buttons').classList.toggle('vehicle',driving);
  document.querySelectorAll('[data-foot]').forEach(el=>el.hidden=driving);
  document.querySelectorAll('[data-vehicle]').forEach(el=>el.hidden=!driving);
  held={};document.querySelectorAll('.control').forEach(el=>el.classList.remove('active'));
}
function enterCar(){
  if(car){
    const old=car;
    player.x=old.x+cos(old.yaw)*2.8;
    player.z=old.z-sin(old.yaw)*2.8;
    if(solid(player.x,player.z)){player.x=old.x;player.z=old.z}
    old.speed=0;old.driverId=null;car=null;
    syncButtons();say('Você saiu do veículo');
    if(socket?.connected)socket.emit('car:toggle');
    return;
  }
  let closest=null,distance=18;
  for(const c of cars){
    if(c.driverId&&c.driverId!==socket?.id)continue;
    const d=Math.hypot(c.x-player.x,c.z-player.z);
    if(d<distance){distance=d;closest=c}
  }
  if(!closest){say('Nenhum carro livre perto');return}
  car=closest;
  car.driverId=socket?.connected?socket.id:'local';
  syncButtons();say(carNames[car.type]||'Veículo');
  if(socket?.connected)socket.emit('car:toggle');
}
function switchCharacter(){
  if(car){say('Saia do carro primeiro');return}
  characters[character]={...player};
  character=(character+1)%3;
  player={...characters[character]};
  say('Controlando '+characterNames[character]);
}
function shoot(){
  if(car||shootCooldown>0)return;
  if(weapon<0){shootCooldown=.5;return}
  if(ammo[weapon]<=0){
    ammo[weapon]=capacities[weapon];shootCooldown=1.2;say('Recarregando...');return;
  }
  ammo[weapon]--;shootCooldown=fireRates[weapon];flash=.08;
  const count=weapon===2?5:1;
  for(let i=0;i<count;i++){
    const angle=player.yaw+rand(-.08,.08);
    bullets.push({x:player.x+sin(angle),z:player.z+cos(angle),vx:sin(angle)*90,vz:cos(angle)*90,life:.5});
  }
}
function cycleWeapon(){
  if(car)return;
  weapon=weapon>=4?-1:weapon+1;
  say(weapon<0?'Desarmado':'Equipado: '+weapons[weapon]);
}
function action(name,down){
  if(name==='fire'||name==='run'||name==='accelerate'||name==='brake'){
    held[name]=down;
    return;
  }
  if(!down)return;
  if(name==='car')enterCar();
  if(name==='swap')switchCharacter();
  if(name==='weapon')cycleWeapon();
  if(name==='crouch')crouch=!crouch;
  if(name==='jump'&&!car&&jumpHeight===0){jumpVelocity=7;jumpHeight=.001}
}

function drive(dt){
  const spec=carSpecs[car.type]||carSpecs[0];
  let throttle=held.accelerate||held.run?1:0;
  if(held.brake){
    if(car.speed>.5)car.speed-=38*dt;
    else throttle=-.6;
  }
  car.speed+=throttle*20*dt;
  car.speed*=throttle===0&&!held.brake?Math.max(0,1-.9*dt):1-.08*dt;
  car.speed=clamp(car.speed,-9,spec.speed);
  car.yaw+=joy.x*Math.min(1,Math.abs(car.speed)/6)*1.7*dt*(car.speed>=0?1:-1);
  const nx=car.x+sin(car.yaw)*car.speed*dt;
  const nz=car.z+cos(car.yaw)*car.speed*dt;
  const collision=carCollision(nx,nz,spec.width+.35,car);
  if(solid(nx,nz)||collision.hit){
    car.speed=-car.speed*.3;
    if(collision.hit){car.x=collision.x;car.z=collision.z}
  }else{car.x=nx;car.z=nz}
  player.x=car.x;player.z=car.z;player.yaw=car.yaw;
  const delta=Math.atan2(sin(car.yaw-camYaw),cos(car.yaw-camYaw));
  camYaw+=delta*Math.min(1,2*dt);
  if(socket?.connected)socket.emit('car:drive',{
    x:car.x,y:car.z,angle:car.yaw,speed:car.speed
  });
}

function update(dt){
  anim+=dt;
  gameTime=(gameTime+dt/1440)%1;
  shootCooldown-=dt;flash-=dt;messageTime-=dt;bubble.time-=dt;
  weatherTimer-=dt;
  if(weatherTimer<=0){weatherTimer=rand(45,100);weather=Math.random()<.75?0:1}

  if(jumpHeight>0){
    jumpVelocity-=22*dt;
    jumpHeight+=jumpVelocity*dt;
    if(jumpHeight<0){jumpHeight=0;jumpVelocity=0}
  }
  if(car)drive(dt);
  else{
    const magnitude=Math.hypot(joy.x,joy.y);
    const mx=joy.x*cos(camYaw)-joy.y*sin(camYaw);
    const mz=-joy.x*sin(camYaw)-joy.y*cos(camYaw);
    const speed=(crouch?1.8:held.run?6.5:3.4)*[1,1.15,.9][character];
    const vx=magnitude>.12?mx*speed:0,vz=magnitude>.12?mz*speed:0;
    const nx=player.x+vx*dt,nz=player.z+vz*dt;
    if(!solid(nx,player.z))player.x=nx;
    if(!solid(player.x,nz))player.z=nz;
    const collision=carCollision(player.x,player.z,.62,null);
    if(collision.hit){player.x=collision.x;player.z=collision.z}
    if(magnitude>.12){
      const direction=Math.atan2(mx,mz);
      const difference=Math.atan2(sin(direction-player.yaw),cos(direction-player.yaw));
      player.yaw+=difference*Math.min(1,18*dt);
    }
    moveAmount=magnitude>.12?Math.min(1,Math.hypot(vx,vz)/5):0;
    moveAnim+=dt*(held.run?13:8)*moveAmount;
    if(held.fire)shoot();
  }
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.x+=b.vx*dt;b.z+=b.vz*dt;b.life-=dt;
    if(b.life<=0||solid(b.x,b.z)||carCollision(b.x,b.z,.2,null).hit)bullets.splice(i,1);
  }
  remotes.forEach(p=>p.bubbleTime=Math.max(0,(p.bubbleTime||0)-dt));
  checkMission();
  $('money').textContent='$'+money;
  $('playerName').textContent=nick;
  $('weaponName').textContent=weapon<0?'Desarmado':weapons[weapon]+' '+ammo[weapon]+'/'+capacities[weapon];
  $('hp').style.width=clamp(health[character]/200*100,0,100)+'%';
  const step=missionStep();
  $('mission').textContent='MISSÃO: '+missions[missionIndex].name+' — '+
    (step.type==='car'?'Roube um carro':step.type==='drive'?'Leve o carro ao ponto':'Vá ao ponto amarelo');
  const hours=gameTime*24;
  $('clock').textContent=String(Math.floor(hours)).padStart(2,'0')+':'+String(Math.floor(hours%1*60)).padStart(2,'0');
  $('message').textContent=messageTime>0?message:'';
}

let cameraX,cameraY,cameraZ,forwardX,forwardZ,focal,horizon;
let brightness=1,fog=0,skyColor=[195,224,241];

function rgb(color,mult=1){
  let r=((color>>16)&255)*mult,gg=((color>>8)&255)*mult,b=(color&255)*mult;
  r=clamp(r,0,255);gg=clamp(gg,0,255);b=clamp(b,0,255);
  const blend=fog*.62;
  return `rgb(${Math.round(r+(skyColor[0]-r)*blend)},${Math.round(gg+(skyColor[1]-gg)*blend)},${Math.round(b+(skyColor[2]-b)*blend)})`;
}
function cameraPoint(x,y,z){
  const dx=x-cameraX,dz=z-cameraZ,dy=y-cameraY;
  const side=dx*forwardZ-dz*forwardX;
  const depth=dx*forwardX+dz*forwardZ;
  const cp=cos(camPitch),sp=sin(camPitch);
  return [side,dy*cp-depth*sp,dy*sp+depth*cp];
}
function project(x,y,z){
  const p=cameraPoint(x,y,z);
  if(p[2]<.6)return null;
  const k=focal/p[2];
  return [W/2+p[0]*k,horizon-p[1]*k,p[2],k];
}
function poly(points,color,outline=0){
  const near=.6,clipped=[];
  for(let i=0;i<points.length;i++){
    const a=points[i],b=points[(i+1)%points.length];
    const inA=a[2]>=near,inB=b[2]>=near;
    if(inA)clipped.push(a);
    if(inA!==inB){
      const t=(near-a[2])/(b[2]-a[2]);
      clipped.push([
        a[0]+(b[0]-a[0])*t,
        a[1]+(b[1]-a[1])*t,
        near
      ]);
    }
  }
  if(clipped.length<3)return;
  g.beginPath();
  clipped.forEach((p,i)=>{
    const k=focal/p[2],x=W/2+p[0]*k,y=horizon-p[1]*k;
    if(i)g.lineTo(x,y);else g.moveTo(x,y);
  });
  g.closePath();g.fillStyle=color;g.fill();
  if(outline){
    g.lineWidth=outline;
    g.strokeStyle='#11171e';
    g.lineJoin='round';g.stroke();
  }
}
function ground(x0,z0,x1,z1,color){
  poly([
    cameraPoint(x0,.025,z0),cameraPoint(x1,.025,z0),
    cameraPoint(x1,.025,z1),cameraPoint(x0,.025,z1)
  ],color);
}
function line3(x1,y1,z1,x2,y2,z2,width,color,outline=false){
  const a=project(x1,y1,z1),b=project(x2,y2,z2);
  if(!a||!b)return;
  const w=Math.max(1.3,width*(a[3]+b[3])*.5);
  g.lineCap='round';
  if(outline){
    g.lineWidth=w+2.2;g.strokeStyle='#11171e';
    g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke();
  }
  g.lineWidth=w;g.strokeStyle=color;
  g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke();
  g.lineCap='butt';
}
function box(x,z,halfW,halfL,y0,y1,angle,color,outline=1){
  const s=sin(angle),c=cos(angle),corners=[];
  for(const [sx,sz] of [[-1,-1],[1,-1],[1,1],[-1,1]]){
    corners.push([x+sx*halfW*c+sz*halfL*s,z-sx*halfW*s+sz*halfL*c]);
  }
  for(let i=0;i<4;i++){
    const a=corners[i],b=corners[(i+1)%4];
    const nx=b[1]-a[1],nz=a[0]-b[0];
    const mx=(a[0]+b[0])*.5,mz=(a[1]+b[1])*.5;
    if(nx*(cameraX-mx)+nz*(cameraZ-mz)<=0)continue;
    const light=.63+.23*(i%2);
    poly([
      cameraPoint(a[0],y0,a[1]),cameraPoint(b[0],y0,b[1]),
      cameraPoint(b[0],y1,b[1]),cameraPoint(a[0],y1,a[1])
    ],rgb(color,light*brightness),outline);
  }
  if(cameraY>y1)poly(corners.map(p=>cameraPoint(p[0],y1,p[1])),rgb(color,brightness),outline);
}
function shadow(x,z,rx,rz){
  const p=project(x,.04,z);if(!p)return;
  g.fillStyle='#05090c55';
  g.beginPath();g.ellipse(p[0],p[1],Math.max(1,rx*p[3]),Math.max(1,rz*p[3]*.35),0,0,TAU);g.fill();
}

function building(ix,iz){
  const seed=hash(ix,iz),x=ix*P,z=iz*P;
  const low=(10+(seed>>4)%38)<18;
  const height=low?5+seed%4:10+(seed>>4)%38;
  const base=pal[(seed>>9)%pal.length];
  shadow(x-3,z-2,17,15);
  box(x,z,15,15,0,height,0,base,1.5);
  box(x,z,15.3,15.3,0,low?2.4:3.2,0,0x374048,1.2);
  box(x,z,15.35,15.35,height-.7,height+.1,0,0xd6d2c4,1.2);

  if(low){
    box(x,z+14.5,12.5,.5,2.5,4.1,0,0x3b454c,.8);
    box(x,z+15.05,6,.15,2.85,3.8,0,0xb78947,.5);
    box(x-7,z-6,2.2,2.2,height,height+1,0,0x7f898d,.7);
  }else{
    for(let y=7;y<height-2;y+=4.1){
      for(let k=-2;k<=2;k++){
        const v=(seed+k*13+Math.floor(y)*7)&7;
        const glass=brightness<.75?(v<4?0xe8ca77:0x344454):0x9dbbc9;
        box(x+k*5.3,z+15.055,1.55,.045,y,y+2.15,0,glass,.45);
        box(x+k*5.3,z-15.055,1.55,.045,y,y+2.15,0,glass,.45);
        box(x+15.055,z+k*5.3,.045,1.55,y,y+2.15,0,glass,.45);
        box(x-15.055,z+k*5.3,.045,1.55,y,y+2.15,0,glass,.45);
      }
      if(y+5<height)box(x,z,15.15,15.15,y+2.6,y+2.83,0,0x657078,.45);
    }
    for(let n=0;n<2;n++){
      const ox=((seed>>(n*4))%13)-6,oz=((seed>>(n*5+3))%13)-6;
      box(x+ox,z+oz,2,2,height,height+1.2,0,0x77838b,.7);
    }
    if(height>30){
      box(x,z,8,8,height,height+4,0,base,1);
      line3(x,height+4,z,x,height+11,z,.35,rgb(0xc5cbd0),true);
    }
  }
}

function tree(x,z,seed){
  const height=5+(seed%4);
  shadow(x,z,2.5,2);
  line3(x,0,z,x,height,z,.48,rgb(0x765237),true);
  const leaf=brightness<.7?0x24512e:0x358b48;
  for(const [dx,dy,dz,r] of [
    [-1,height-.3,0,2.7],
    [1,height+.2,.5,2.6],
    [0,height+1,-.5,2.8]
  ]){
    const p=project(x+dx,dy,z+dz);
    if(!p)continue;
    g.fillStyle=rgb(leaf,brightness);
    g.strokeStyle='#16251c';
    g.lineWidth=1.5;
    g.beginPath();
    g.arc(p[0],p[1],Math.max(2,r*p[3]),0,TAU);
    g.fill();g.stroke();
  }
}

function streetLamp(x,z){
  line3(x,0,z,x,6.2,z,.23,rgb(0x626970),true);
  line3(x,6.2,z,x+1.25,6.2,z,.2,rgb(0x626970),true);
  const p=project(x+1.25,6.05,z);
  if(!p)return;
  const on=brightness<.7;
  if(on){
    const radius=clamp(p[3]*2.6,5,80);
    const halo=g.createRadialGradient(p[0],p[1],0,p[0],p[1],radius);
    halo.addColorStop(0,'rgba(255,232,160,.45)');
    halo.addColorStop(1,'rgba(255,232,160,0)');
    g.fillStyle=halo;
    g.fillRect(p[0]-radius,p[1]-radius,radius*2,radius*2);
  }
  g.fillStyle=on?'#fff0ae':'#c6cbd0';
  g.beginPath();
  g.arc(p[0],p[1],Math.max(2,p[3]*.35),0,TAU);
  g.fill();
}

function drawCar(c){
  const spec=carSpecs[c.type]||carSpecs[0];
  const s=sin(c.yaw),co=cos(c.yaw);
  function part(lx,lz,w,l,y0,y1,color,edge=1){
    box(c.x+lx*co+lz*s,c.z-lx*s+lz*co,w,l,y0,y1,c.yaw,color,edge);
  }
  shadow(c.x,c.z,spec.width*1.7,spec.length*1.4);
  for(const side of [-1,1])for(const end of [-1,1]){
    part(side*(spec.width+.04),end*spec.length*.61,.17,.47,0,.65,0x171a1e,1);
  }
  part(0,0,spec.width,spec.length,.32,spec.height,c.color,1.6);
  part(0,-.18,spec.width*.82,spec.length*.52,spec.height,spec.height+.68,0x587b91,1.2);
  part(0,spec.length+.1,spec.width*.84,.14,.38,.68,0x353b42,.8);
  part(0,-spec.length-.1,spec.width*.84,.14,.38,.68,0x353b42,.8);
  part(0,spec.length+.2,spec.width*.36,.05,.48,.65,0x171a1f,.5);
  for(const side of [-1,1]){
    part(side*spec.width*.7,spec.length+.08,.19,.07,.58,.81,
      brightness<.7?0xffefb2:0xe8e9db,.5);
    part(side*spec.width*.7,-spec.length-.08,.19,.07,.51,.77,0xc73330,.5);
    part(side*spec.width*.94,-.1,.045,spec.length*.75,.65,.72,0xb3bbc1,.4);
  }
}

function drawPerson(p,isLocal=false){
  const x=p.x,z=p.z,yaw=p.yaw||0;
  const base=project(x,0,z);
  if(!base||base[0]<-140||base[0]>W+140)return;
  const shirt=isLocal?shirts[character]:0x00bcd4;
  const skin=isLocal?skins[character]:0xe0ac69;
  const pace=isLocal?moveAmount:(p.amp||0);
  const phase=isLocal?moveAnim:(p.phase||0);
  const swing=sin(phase)*.3*pace;
  const yJump=isLocal?jumpHeight:0;
  const crouched=isLocal&&crouch;
  const hip=.85+yJump-(crouched?.25:0);
  const head=1.74+yJump-(crouched?.36:0);
  const s=sin(yaw),co=cos(yaw);
  function local(lx,y,lz){
    return [x+lx*co+lz*s,y,z-lx*s+lz*co];
  }
  function limb(a,b,width,color){
    const A=local(...a),B=local(...b);
    line3(A[0],A[1],A[2],B[0],B[1],B[2],width,rgb(color,brightness),true);
  }
  shadow(x,z,.6,.5);
  limb([-.14,hip,0],[-.14,.42+yJump,-swing],.17,0x35434d);
  limb([-.14,.42+yJump,-swing],[-.14,.09+yJump,-swing*1.5],.14,0x35434d);
  limb([.14,hip,0],[.14,.42+yJump,swing],.17,0x35434d);
  limb([.14,.42+yJump,swing],[.14,.09+yJump,swing*1.5],.14,0x35434d);
  limb([0,hip,0],[0,head-.3,0],.37,shirt);
  limb([-.22,head-.35,0],[-.3,head-.72,swing],.13,shirt);
  limb([-.3,head-.72,swing],[-.32,head-.91,swing+.12],.1,skin);
  limb([.22,head-.35,0],[.3,head-.71,-swing],.13,shirt);
  limb([.3,head-.71,-swing],[.3,head-.89,-swing+.12],.1,skin);
  limb([0,head-.28,0],[0,head-.12,0],.11,skin);
  const face=local(0,head,0),screen=project(...face);
  if(screen){
    g.fillStyle=rgb(skin,brightness);
    g.strokeStyle='#17191d';g.lineWidth=1.5;
    g.beginPath();
    g.arc(screen[0],screen[1],clamp(screen[3]*.16,2,26),0,TAU);
    g.fill();g.stroke();
    g.fillStyle='#272527';
    g.beginPath();
    g.arc(screen[0],screen[1]-screen[3]*.07,
      clamp(screen[3]*.14,2,24),PI,TAU);
    g.fill();
  }
  if(isLocal&&weapon>=0){
    const hand=local(.3,head-.89,-swing+.12);
    const tip=local(.3,head-.86,-swing+.7);
    line3(...hand,...tip,.08,rgb(0x292d34,brightness),true);
  }
}

function label(x,y,z,name,text){
  const p=project(x,y,z);
  if(!p||p[0]<-150||p[0]>W+150)return;
  g.save();
  g.textAlign='center';g.textBaseline='middle';
  g.font='bold 12px Arial';
  if(text){
    const msg=String(text).slice(0,110);
    const width=clamp(g.measureText(msg).width+18,35,280);
    g.fillStyle='#111923e8';
    g.strokeStyle='#ffd54f';
    g.lineWidth=1;
    g.beginPath();
    if(g.roundRect)g.roundRect(p[0]-width/2,p[1]-39,width,22,6);
    else g.rect(p[0]-width/2,p[1]-39,width,22);
    g.fill();g.stroke();
    g.fillStyle='#fff';g.fillText(msg,p[0],p[1]-28,width-10);
  }
  if(name){
    g.lineWidth=3;g.strokeStyle='#111';
    g.strokeText(name,p[0],p[1]-6);
    g.fillStyle='#00e5ff';
    g.fillText(name,p[0],p[1]-6);
  }
  g.restore();
}

function airport(){
  const x=14*P+32,z=13*P+32;
  ground(x-155,z-19,x+155,z+19,'#363b41');
  for(let i=-5;i<=5;i++){
    ground(x+i*25-7,z-.5,x+i*25+7,z+.5,'#eee9d0');
  }
  for(const end of [-1,1]){
    ground(x+end*143-1,z-13,x+end*143+1,z+13,'#eee9d0');
  }
}

function sky(){
  const sun=sin((gameTime-.25)*TAU);
  brightness=sun<-.15?.56:clamp(.65+sun*.45,.68,1);
  skyColor=brightness<.7?[72,91,122]:weather?[165,179,190]:[195,224,241];
  const grad=g.createLinearGradient(0,0,0,H);
  if(brightness<.7){
    grad.addColorStop(0,'#09172b');
    grad.addColorStop(1,'#8295aa');
  }else if(weather){
    grad.addColorStop(0,'#788893');
    grad.addColorStop(1,'#c2cbd0');
  }else{
    grad.addColorStop(0,'#2674b6');
    grad.addColorStop(1,'#e3e9e1');
  }
  g.fillStyle=grad;g.fillRect(0,0,W,H);
  const horizonY=clamp(horizon+focal*Math.tan(camPitch),0,H);
  g.fillStyle=brightness<.7?'#33383e':'#666b70';
  g.fillRect(0,horizonY,W,H-horizonY);
  const sunX=W/2+cos((gameTime-.25)*TAU)*W*.43;
  const sunY=horizonY-sun*H*.55;
  if(sun>-.1&&!weather){
    const halo=g.createRadialGradient(sunX,sunY,0,sunX,sunY,H*.18);
    halo.addColorStop(0,'rgba(255,230,140,.65)');
    halo.addColorStop(1,'rgba(255,230,140,0)');
    g.fillStyle=halo;
    g.fillRect(sunX-H*.18,sunY-H*.18,H*.36,H*.36);
    g.fillStyle='#ffedb8';
    g.beginPath();g.arc(sunX,sunY,Math.max(12,H*.025),0,TAU);g.fill();
  }
}

function renderMap(){
  mg.clearRect(0,0,180,180);
  mg.save();
  mg.beginPath();mg.arc(90,90,87,0,TAU);mg.clip();
  mg.fillStyle='#313943';mg.fillRect(0,0,180,180);
  mg.translate(90,90);mg.rotate(-camYaw);
  const ix=Math.round(player.x/P),iz=Math.round(player.z/P);
  for(let i=-2;i<=2;i++)for(let j=-2;j<=2;j++){
    const bx=ix+i,bz=iz+j;
    const x=(bx*P-player.x)*.7,y=-(bz*P-player.z)*.7;
    mg.fillStyle=zone(bx,bz)?'#819655':
      hash(bx,bz)%6===0?'#538357':'#798692';
    mg.fillRect(x-14,y-14,28,28);
  }
  for(const c of cars){
    const x=(c.x-player.x)*.7,y=-(c.z-player.z)*.7;
    mg.fillStyle='#ffb74d';mg.fillRect(x-3,y-3,6,6);
  }
  remotes.forEach(p=>{
    const x=(p.x-player.x)*.7,y=-(p.z-player.z)*.7;
    mg.fillStyle='#00e5ff';
    mg.beginPath();mg.arc(x,y,4,0,TAU);mg.fill();
  });
  const step=missionStep();
  if(step.type!=='car'){
    let x=(target.x-player.x)*.7,y=-(target.z-player.z)*.7;
    const d=Math.hypot(x,y);
    if(d>76){x=x/d*76;y=y/d*76}
    mg.fillStyle='#ffd600';
    mg.beginPath();mg.arc(x,y,6,0,TAU);mg.fill();
  }
  mg.restore();
  mg.save();mg.translate(90,90);
  mg.rotate(player.yaw-camYaw);
  mg.fillStyle='#fff';mg.strokeStyle='#111';
  mg.beginPath();mg.moveTo(0,-10);mg.lineTo(7,8);mg.lineTo(0,4);mg.lineTo(-7,8);
  mg.closePath();mg.fill();mg.stroke();
  mg.restore();
}

function render(){
  forwardX=sin(camYaw);forwardZ=cos(camYaw);
  focal=H*.95;horizon=H*.42;
  const distance=car?11.5:8.2;
  cameraX=player.x-forwardX*distance*cos(camPitch);
  cameraZ=player.z-forwardZ*distance*cos(camPitch);
  cameraY=Math.max(.75,(car?4.2:3.2)-distance*sin(camPitch)+jumpHeight*.5);
  sky();

  const bx=Math.round(cameraX/P),bz=Math.round(cameraZ/P);
  const objects=[];
  for(let i=-3;i<=3;i++)for(let j=-3;j<=3;j++){
    const ix=bx+i,iz=bz+j,x=ix*P,z=iz*P;
    if((x-cameraX)*forwardX+(z-cameraZ)*forwardZ<-43)continue;
    const d=(x-cameraX)**2+(z-cameraZ)**2;
    const zn=zone(ix,iz),park=!zn&&hash(ix,iz)%6===0;
    if(zn){
      objects.push({d:d+200,draw:()=>ground(x-32,z-32,x+32,z+32,rgb(0x9caa6d,brightness))});
      for(let n=0;n<3;n++){
        const t=treePosition(ix,iz,n);
        objects.push({d:(t.x-cameraX)**2+(t.z-cameraZ)**2,
          draw:()=>tree(t.x,t.z,t.seed)});
      }
    }else{
      objects.push({d:d+200,draw:()=>{
        ground(x-21,z-21,x+21,z+21,rgb(0x777c82,brightness));
        ground(x-19.5,z-19.5,x+19.5,z+19.5,
          rgb(park?0x63935e:0xb2b6ba,brightness));
      }});
      if(!park){
        objects.push({d,draw:()=>building(ix,iz)});
        const px=x+17.5,pz=z+17.5;
        objects.push({d:(px-cameraX)**2+(pz-cameraZ)**2,
          draw:()=>streetLamp(px,pz)});
      }
      if(Math.abs(i)<3&&Math.abs(j)<3){
        for(let k=-1;k<=1;k++){
          objects.push({d:d+130,draw:()=>{
            ground(x+k*10-3,z+31.5,x+k*10+3,z+32.5,rgb(0xe9d78a,brightness));
            ground(x+31.5,z+k*10-3,x+32.5,z+k*10+3,rgb(0xe9d78a,brightness));
          }});
        }
      }
    }
  }

  objects.push({d:(14*P+32-cameraX)**2+(13*P+32-cameraZ)**2+250,
    draw:airport});

  for(const c of cars){
    const d=(c.x-cameraX)**2+(c.z-cameraZ)**2;
    if(d<22500)objects.push({d,draw:()=>drawCar(c)});
  }
  if(!car){
    objects.push({
      d:(player.x-cameraX)**2+(player.z-cameraZ)**2,
      draw:()=>drawPerson(player,true)
    });
  }
  remotes.forEach(p=>{
    if(p.inCarId)return;
    const d=(p.x-cameraX)**2+(p.z-cameraZ)**2;
    if(d<22500)objects.push({d,draw:()=>drawPerson(p)});
  });

  objects.sort((a,b)=>b.d-a.d);
  for(const item of objects){
    fog=clamp((Math.sqrt(Math.max(0,item.d))-50)/210,0,.75);
    item.draw();
  }
  fog=0;

  const step=missionStep();
  if(step.type!=='car'){
    const p=project(target.x,1.5+sin(anim*3)*.3,target.z);
    if(p){
      const radius=clamp(p[3]*.7,5,42);
      g.fillStyle='#ffd600';
      g.strokeStyle='#1c1c1c';g.lineWidth=2;
      g.beginPath();g.arc(p[0],p[1],radius,0,TAU);g.fill();g.stroke();
      g.fillStyle='#fff';g.font='bold 12px Arial';g.textAlign='center';
      g.fillText(Math.round(Math.hypot(target.x-player.x,target.z-player.z))+' m',
        p[0],p[1]-radius-8);
    }
  }

  for(const b of bullets){
    const p=project(b.x,1.4,b.z);
    if(p){
      g.fillStyle='#ffec83';
      g.beginPath();g.arc(p[0],p[1],3,0,TAU);g.fill();
    }
  }
  if(flash>0&&!car){
    const p=project(player.x+sin(player.yaw),1.35,player.z+cos(player.yaw));
    if(p){
      g.fillStyle='#ffe185';
      g.beginPath();g.arc(p[0],p[1],Math.max(4,p[3]*.3),0,TAU);g.fill();
    }
  }

  remotes.forEach(p=>{
    label(p.x,p.inCarId?2.7:2.2,p.z,
      '🌐 '+(p.name||'Jogador'),p.bubbleTime>0?p.bubble:'');
  });
  if(bubble.time>0)label(player.x,car?2.7:2.2,player.z,'',bubble.text);

  if(weather){
    g.strokeStyle='#b6d2e5aa';
    g.lineWidth=1.2;
    for(let i=0;i<55;i++){
      const x=(i*97+anim*42)%W,y=(i*61+anim*480)%H;
      g.beginPath();g.moveTo(x,y);g.lineTo(x-5,y+25);g.stroke();
    }
  }
  const vignette=g.createRadialGradient(W/2,H/2,H*.25,W/2,H/2,Math.max(W,H)*.72);
  vignette.addColorStop(0,'#0000');
  vignette.addColorStop(1,'#0006');
  g.fillStyle=vignette;g.fillRect(0,0,W,H);
  renderMap();
}

function status(text){$('status').textContent=text}
function badge(){
  $('onlineButton').textContent=connected?'🌐 ONLINE: CONECTADO':'🌐 ONLINE: OFFLINE';
  $('onlineButton').className='pill '+(connected?'online':'offline');
  const count=connected?1+remotes.size:1;
  $('count').textContent=count+(count===1?' PLAYER':' PLAYERS');
}
function appendChat(name,text){
  const row=document.createElement('div');
  row.className='chatLine';
  const bold=document.createElement('b');
  bold.textContent=name+': ';
  row.append(bold,document.createTextNode(text));
  $('chatLog').append(row);
  while($('chatLog').children.length>5)$('chatLog').firstChild.remove();
}
function applyCars(data){
  if(!data)return;
  const list=Array.isArray(data)?data:Object.keys(data).map(id=>({id,...data[id]}));
  list.forEach((entry,index)=>{
    if(!entry)return;
    const id=entry.id||'carro_'+(index+1);
    let local=cars.find(c=>c.id===id);
    if(!local){
      local={
        id,x:24+index*16,z:50,yaw:0,speed:0,
        color:carColors[index%carColors.length],
        type:index%4,driverId:null
      };
      cars.push(local);
    }
    if(typeof entry.x==='number')local.x=entry.x;
    if(typeof entry.y==='number')local.z=entry.y;
    else if(typeof entry.z==='number')local.z=entry.z;
    if(typeof entry.angle==='number')local.yaw=entry.angle;
    else if(typeof entry.yaw==='number')local.yaw=entry.yaw;
    if(typeof entry.speed==='number')local.speed=entry.speed;
    if(entry.driverId!==undefined)local.driverId=entry.driverId||null;
    if(car===local&&local.driverId&&socket&&local.driverId!==socket.id){
      car=null;syncButtons();
    }
  });
}
function upsertRemote(p){
  if(!p?.id||p.id===socket?.id)return;
  const old=remotes.get(p.id);
  const x=typeof p.x==='number'?p.x:old?.x||0;
  const z=typeof p.y==='number'?p.y:
    typeof p.z==='number'?p.z:old?.z||0;
  const moved=old&&Math.hypot(x-old.x,z-old.z)>.02;
  remotes.set(p.id,{
    id:p.id,
    x,z,
    yaw:typeof p.angle==='number'?p.angle:
      typeof p.yaw==='number'?p.yaw:old?.yaw||0,
    name:String(p.name||old?.name||'Jogador').slice(0,16),
    inCarId:p.inCarId!==undefined?p.inCarId:old?.inCarId||null,
    bubble:old?.bubble||'',
    bubbleTime:old?.bubbleTime||0,
    phase:(old?.phase||0)+(moved?.4:0),
    amp:moved?.7:0
  });
  badge();
}
function sendState(){
  if(!socket?.connected)return;
  socket.emit('player:move',{
    x:player.x,y:player.z,angle:player.yaw,
    name:nick,inCarId:car?car.id:null
  });
}
function loadSocketIo(origin){
  return new Promise((resolve,reject)=>{
    if(typeof window.io==='function'){resolve(window.io);return}
    const script=document.createElement('script');
    script.src=origin+'/socket.io/socket.io.js';
    script.onload=()=>typeof window.io==='function'?
      resolve(window.io):reject(new Error('Socket.IO não carregou'));
    script.onerror=()=>reject(new Error('Falha ao carregar Socket.IO'));
    document.head.append(script);
  });
}
async function connect(){
  nick=($('nickInput').value.trim()||nick).slice(0,16);
  serverUrl=$('serverInput').value.trim();
  try{
    localStorage.setItem('gtax_mp_nick',nick);
    localStorage.setItem('gtax_mp_url',serverUrl);
  }catch(_){}
  const origin=(serverUrl||
    (location.origin!=='null'?location.origin:'')).replace(/\/+$/,'');
  if(!origin){status('Informe a URL do servidor.');badge();return}
  status('Conectando em '+origin+'...');
  try{
    const io=await loadSocketIo(origin);
    if(socket)socket.disconnect();
    remotes.clear();connected=false;badge();
    const current=io(origin,{transports:['websocket','polling']});
    socket=current;
    current.on('connect',()=>{
      if(socket!==current)return;
      connected=true;badge();sendState();
      status('Conectado como '+nick+'!');
      say('Conectado como '+nick+'!');
    });
    current.on('init',data=>{
      if(data?.players){
        for(const [id,p] of Object.entries(data.players)){
          if(id!==current.id)upsertRemote({...p,id});
        }
      }
      if(data?.cars)applyCars(data.cars);
      sendState();
    });
    current.on('player:join',upsertRemote);
    current.on('player:move',upsertRemote);
    current.on('player:update',upsertRemote);
    current.on('player:leave',id=>{remotes.delete(id);badge()});
    current.on('car:update',entry=>applyCars([entry]));
    current.on('car:drive',entry=>{
      if(!entry?.id||car?.id===entry.id)return;
      applyCars([entry]);
    });
    current.on('chat:msg',payload=>{
      if(!payload?.text)return;
      const text=String(payload.text).slice(0,110);
      const sender=String(payload.name||'Jogador').slice(0,16);
      appendChat(sender,text);
      if(payload.id===current.id){
        bubble={text,time:4.5};
      }else if(payload.id){
        const p=remotes.get(payload.id);
        if(p){p.bubble=text;p.bubbleTime=4.5}
      }
    });
    current.on('disconnect',()=>{
      if(socket!==current)return;
      connected=false;remotes.clear();badge();
    });
    current.on('connect_error',()=>{
      if(socket!==current)return;
      connected=false;badge();
      status('Servidor não respondeu em '+origin+'. Confirme que há um servidor Socket.IO ativo nessa URL.');
    });
  }catch(e){
    connected=false;badge();
    status('O HTML está unido. Para jogar online, informe a URL de um servidor Socket.IO; GitHub Pages hospeda apenas o site, não o servidor.');
  }
}
function sendChat(){
  const input=$('chatInput'),text=input.value.trim();
  if(!text)return;
  input.value='';
  if(socket?.connected){
    socket.emit('chat:msg',{name:nick,text});
  }else{
    appendChat(nick,text);
    bubble={text,time:4.5};
  }
}

$('closeOnline').onclick=()=>$('onlineModal').style.display='none';

setInterval(sendState,80);

$('serverInput').value=serverUrl;
badge();

const joystick=$('joystick'),knob=$('knob');
let joyPointer=null,camPointer=null,lastX=0,lastY=0;
function moveJoy(e){
  const rect=joystick.getBoundingClientRect();
  let x=(e.clientX-rect.left-rect.width/2)/(rect.width*.38);
  let y=(e.clientY-rect.top-rect.height/2)/(rect.height*.38);
  const length=Math.hypot(x,y);
  if(length>1){x/=length;y/=length}
  joy.x=x;joy.y=y;
  knob.style.transform=`translate(${x*rect.width*.28}px,${y*rect.height*.28}px)`;
}
joystick.onpointerdown=e=>{
  joyPointer=e.pointerId;
  joystick.setPointerCapture(e.pointerId);
  moveJoy(e);
};
joystick.onpointermove=e=>{if(e.pointerId===joyPointer)moveJoy(e)};
function releaseJoy(e){
  if(e.pointerId!==joyPointer)return;
  joyPointer=null;joy.x=0;joy.y=0;knob.style.transform='';
}
joystick.onpointerup=releaseJoy;
joystick.onpointercancel=releaseJoy;

canvas.onpointerdown=e=>{
  if(e.clientX<W*.4)return;
  camPointer=e.pointerId;
  lastX=e.clientX;lastY=e.clientY;
  canvas.setPointerCapture(e.pointerId);
};
canvas.onpointermove=e=>{
  if(e.pointerId!==camPointer)return;
  camYaw=Math.atan2(
    sin(camYaw+(e.clientX-lastX)*.006),
    cos(camYaw+(e.clientX-lastX)*.006)
  );
  camPitch=clamp(camPitch-(e.clientY-lastY)*.0065,-.55,1.25);
  lastX=e.clientX;lastY=e.clientY;
};
canvas.onpointerup=canvas.onpointercancel=e=>{
  if(e.pointerId===camPointer)camPointer=null;
};

document.querySelectorAll('.control').forEach(button=>{
  const name=button.dataset.action;
  button.onpointerdown=e=>{
    e.preventDefault();
    button.setPointerCapture(e.pointerId);
    button.classList.add('active');
    action(name,true);
  };
  const release=()=>{
    button.classList.remove('active');
    action(name,false);
  };
  button.onpointerup=release;
  button.onpointercancel=release;
  button.onlostpointercapture=release;
});
function pause(){
  paused=!paused;
  $('pauseModal').style.display=paused?'flex':'none';
}
$('pause').onclick=pause;
$('resume').onclick=pause;
$('restart').onclick=()=>location.reload();

const keys=new Set();
function keyboardMovement(){
  joy.x=(keys.has('a')||keys.has('ArrowLeft')?-1:0)+
        (keys.has('d')||keys.has('ArrowRight')?1:0);
  joy.y=(keys.has('s')||keys.has('ArrowDown')?1:0)+
        (keys.has('w')||keys.has('ArrowUp')?-1:0);
  held.accelerate=keys.has('w')||keys.has('ArrowUp');
  held.brake=keys.has('s')||keys.has('ArrowDown');
  held.run=keys.has('Shift');
  held.fire=keys.has(' ');
}
addEventListener('keydown',e=>{
  if(document.activeElement?.tagName==='INPUT')return;
  if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();
  if(keys.has(e.key))return;
  keys.add(e.key);
  keyboardMovement();
  if(e.key==='e'||e.key==='E')enterCar();
  if(e.key==='j'||e.key==='J')action('jump',true);
  if(e.key==='q'||e.key==='Q')cycleWeapon();
  if(e.key==='c'||e.key==='C')action('crouch',true);
  if(e.key==='t'||e.key==='T')switchCharacter();
  if(e.key==='Escape')pause();
});
addEventListener('keyup',e=>{
  keys.delete(e.key);
  keyboardMovement();
});
addEventListener('blur',()=>{
  keys.clear();held={};joy.x=joy.y=0;
  knob.style.transform='';
});

let lastFrame=0;
function frame(now){
  try{
    const raw=lastFrame?(now-lastFrame)/1000:1/60;
    lastFrame=now;
    const dt=clamp(raw,.001,.05);
    if(!paused)update(dt);
    render();
    frameTime+=raw;frames++;
    if(frames>=40){
      const average=frameTime/frames;
      const next=average>.027&&quality>.55?
        Math.max(.55,quality-.15):
        average<.02&&quality<1?Math.min(1,quality+.1):quality;
      if(next!==quality){quality=next;resize()}
      frames=0;frameTime=0;
    }
  }catch(e){
    $('error').style.display='block';
    $('error').textContent='Erro no jogo: '+(e?.stack||e);
  }
  requestAnimationFrame(frame);
}
syncButtons();
say('Bem-vindo ao GTA X!');
requestAnimationFrame(frame);

})();
